name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: pip install fonttools brotli

      # Same script the site uses, so the release asset and the download at
      # blode.co/glide/glide.zip are the same bundle. fonts/static is derived
      # and gitignored, so it has to be regenerated here.
      - name: Build the desktop bundle
        run: python3 scripts/make-desktop-bundle.py

      - name: Verify public font mirrors and bundle members
        run: npm run check

      - name: Name the archive after the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp apps/web/public/glide.zip "Glide-${VERSION}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: Glide-*.zip
